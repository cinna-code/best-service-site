{% load static %}
<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="{{ page.search_description }}" />
    <title>{{ page.seo_title|default:page.title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'home/styles.css' %}" />
    <link rel="stylesheet" href="{% static 'home/brand-update.css' %}" />
  </head>
  <body>
    {% block content %}{% endblock %}
    <script src="{% static 'home/script.js' %}"></script>
  </body>
</html>
